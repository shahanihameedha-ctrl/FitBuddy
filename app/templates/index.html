<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - AI Fitness Plan</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>FitBuddy AI</h1>
        <form action="/generate" method="post">
            <label>Age:</label>
            <input type="number" name="age" required><br><br>
            <label>Fitness Goal:</label>
            <input type="text" name="goal" placeholder="Weight Loss, Muscle Gain..." required><br><br>
            <button type="submit">Generate Plan</button>
        </form>
    </div>
</body>
</html>
